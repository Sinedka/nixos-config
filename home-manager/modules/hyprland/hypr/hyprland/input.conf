input {
    kb_layout = us, ru
    kb_options = grp:caps_toggle
    numlock_by_default = false
    repeat_delay = 250
    repeat_rate = 35
    sensitivity = -0.5  # Increase this value (default is 0)

    focus_on_close = 1

    touchpad {
        natural_scroll = true
        disable_while_typing = $touchpadDisableTyping
        scroll_factor = $touchpadScrollFactor
    }
}

binds {
    scroll_event_delay = 0
}

cursor {
    hotspot_padding = 1
}

